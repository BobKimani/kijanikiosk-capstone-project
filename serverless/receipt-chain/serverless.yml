service: kk-receipt-chain

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'staging'}
  environment:
    RECEIPT_BUCKET: kk-payments-receipts-${self:provider.stage}

functions:
  kkValidator:
    handler: src/validator.handler
    events:
      - s3:
          bucket: kk-payments-receipts-${self:provider.stage}
          event: s3:ObjectCreated:*
          existing: true

  kkFormatter:
    handler: src/formatter.handler

  kkNotifier:
    handler: src/notifier.handler
