---
- name: Configure KijaniKiosk production environment
  hosts: production
  gather_facts: false

  tasks:
    - name: Verify production namespace exists
      ansible.builtin.command:
        cmd: kubectl get namespace {{ k8s_namespace }}
      changed_when: false

    - name: Apply production k8s manifests
      ansible.builtin.command:
        cmd: kubectl apply -k k8s/production
        chdir: "{{ playbook_dir }}/../../.."
      register: production_apply

    - name: Show production apply result
      ansible.builtin.debug:
        var: production_apply.stdout